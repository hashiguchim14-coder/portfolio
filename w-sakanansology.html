  <p class="caption">
	本書は魚にまつわる物語を集めたアンソロジーです。また、それぞれの物語と呼応する写真を撮り、物語の世界を「写真」という文章とは別の表現方法で表現しました。文章の合間に写真を差し込むことで、視覚的にも物語を感じられる本になっています。製本方法は上製本で、表紙には魚の鱗を連想させる、光沢のある紙を使いました。さらに、箱に入れることで物質として保存しておきたくなるような形にしました。二人での制作で、写真撮影はもう一人が担当しています。
