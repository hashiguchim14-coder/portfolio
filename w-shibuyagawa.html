  <p class="caption">
	渋谷区には渋谷川という河川が流れていますが、現在では渋谷川の大部分が暗渠化され、人々が水の流れを感じることができるのはごく一部分になっています。この「渋谷川ウォーク」は、渋谷駅からスタートし、暗渠化された渋谷川の上を歩き、暗渠化の歴史を学んだり、かつての流れに思いを馳せるイベントです。イベント時のコースの一部である道路と、今でも水の流れが見えている河川部分の２枚の写真を用いました。黄色と水色のグラフィックは渋谷川を表し、ピンク色のグラフィックは渋谷区を表しています。
